spring.application.name=BTS
# Database related config
#spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bts}
#spring.datasource.username=${DB_USER:postgres}
#spring.datasource.password=${DB_PASS:ggg}
#spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=${PGSSLMODE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: Connection pool settings
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.show-sql=true
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate=ERROR

jwt.token.expiration=3600000
server.forward-headers-strategy=framework
app.timezone=${APP_TIMEZONE:UTC}
springdoc.swagger-ui.operationsSorter= none
springdoc.swagger-ui.tagsSorter: alpha
springdoc.swagger-ui.default-models-expand-depth=-1

attachments.upload.dir= /files/attachments
